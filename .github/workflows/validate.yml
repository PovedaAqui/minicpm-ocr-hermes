name: validate

on:
  push:
  pull_request:

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hermes plugin validation
        # Same check the plugin-catalog admission CI runs: manifest, config schema,
        # isolated capability probe, declared-vs-registered tools, security scan,
        # no core overrides.
        uses: NousResearch/hermes-agent/.github/actions/plugin-validate@main
        with:
          path: minicpm_ocr

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev tools
        run: python -m pip install --upgrade pip pytest ruff

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: python -m pytest
